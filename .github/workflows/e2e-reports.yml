name: E2E Tests and Reports

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Cucumber tests
        if: always()
        run: npm run test:cucumber

      - name: Generate custom Cucumber report
        if: always()
        run: npm run report

      - name: Prepare static site
        if: always()
        run: |
          mkdir -p site

          if [ -f cucumber-native-report.html ]; then
            cp cucumber-native-report.html site/
          fi

          if [ -f cucumber-custom-report.html ]; then
            cp cucumber-custom-report.html site/
          fi

          if [ -f cucumber-report.json ]; then
            cp cucumber-report.json site/
          fi

          if [ -d test-results/screenshots ]; then
            mkdir -p site/test-results
            cp -r test-results/screenshots site/test-results/
          fi

          if [ -d playwright-report ]; then
            cp -r playwright-report site/
          fi

          cat > site/index.html << 'EOF'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Relatórios E2E</title>
          </head>
          <body>
            <h1>Relatórios E2E</h1>
            <ul>
              <li><a href="./cucumber-native-report.html">Cucumber HTML (nativo)</a></li>
              <li><a href="./cucumber-custom-report.html">Cucumber HTML (custom)</a></li>
              <li><a href="./playwright-report/index.html">Playwright HTML (quando disponível)</a></li>
              <li><a href="./cucumber-report.json">Cucumber JSON</a></li>
            </ul>
            <p>Se algum link não abrir, significa que aquele relatório não foi gerado nesta execução.</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-and-build-reports
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
