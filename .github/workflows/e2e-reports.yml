name: E2E Tests and Reports

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Cucumber tests
        if: always()
        run: SCREENSHOTS=false ATTACH_VIDEO=false npm run test:cucumber

      - name: Generate custom Cucumber report
        if: always()
        run: npm run report

      - name: Upload videos artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-videos
          path: test-results/videos/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare static site
        if: always()
        run: |
          mkdir -p site

          if [ -f cucumber-custom-report.html ]; then
            cp cucumber-custom-report.html site/
            cp cucumber-custom-report.html site/index.html
          else
            printf '%s\n' '<!doctype html>' '<html lang="pt-BR">' '<head>' '  <meta charset="utf-8" />' '  <meta name="viewport" content="width=device-width, initial-scale=1" />' '  <title>Relatório não encontrado</title>' '</head>' '<body>' '  <h1>Relatório customizado não foi gerado nesta execução.</h1>' '</body>' '</html>' > site/index.html
          fi

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-and-build-reports
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
